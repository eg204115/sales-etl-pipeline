services:
  postgres:
    image: postgres:16-alpine
    container_name: sales_etl_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sales_dw}
      POSTGRES_USER: ${DB_USER:-etl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-etl_user} -d ${DB_NAME:-sales_dw}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
